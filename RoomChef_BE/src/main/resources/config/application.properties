# Google Gemini API Key
gemini.api.key=YOUR_GEMINI_API_KEY_HERE

# 공공데이터포털 / 식품안전나라 레시피 API 키
public.recipe.api.key=YOUR_PUBLIC_API_KEY_HERE

# 유튜브 데이터 API v3 키
youtube.api.key=YOUR_YOUTUBE_API_KEY_HERE

# JWT Secret Key
jwt.secret=thisissecretkeyforroomchefreactspringserver1234567890roomchefsecret

# CORS 허용 출처
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

server.port=${PORT:8080}
app.frontend.url=http://localhost:5173
